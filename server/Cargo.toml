[package]
name = "espuino-label-printer"
version = "0.1.0"
edition = "2021"
description = "REST API backend for printing ESPuino/phoniebox/TONUino/SonUINO RFID card labels"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
utoipa = { version = "4", features = ["uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum", "vendored"] }
thiserror = "1"
anyhow = "1"
# Stripe is talked to directly rather than through an SDK: we need exactly one
# API call plus one HMAC check, so this is less code and a much smaller
# dependency tree than a full API binding.
#
# Features are opt-in rather than default: the default set turns on HTTP/2,
# which makes `h2` a hard dependency and drags in a second, incompatible HTTP
# stack next to axum's. Stripe speaks HTTP/1.1 perfectly well.
# TLS is native-tls (openssl), which the flake already provides.
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
hmac = "0.12"
sha2 = "0.10"
# Markdown for the black-only card back (server side of the render contract in
# web/src/lib/backText.ts). CommonMark parsing only; the HTML writer is our own
# (server/src/backtext.rs), so the `html`/`getopts` default features are off and
# the tree stays small.
pulldown-cmark = { version = "0.13", default-features = false }